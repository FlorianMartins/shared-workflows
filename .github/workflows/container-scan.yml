# =============================================================================
# Container image — build it, prove it runs, scan it, describe it.
#
#   gate    fixable CRITICAL/HIGH CVEs fail the job        (Trivy, table)
#   report  every severity, for code scanning              (Trivy, SARIF)
#   sbom    what exactly is inside the image               (Syft, SPDX)
#
#   jobs:
#     container:
#       uses: FlorianMartins/shared-workflows/.github/workflows/container-scan.yml@<sha> # v1.x
#       permissions:
#         contents: read
#         security-events: write
#       with:
#         smoke-command: "--version"
# =============================================================================
name: Container scan

on:
  workflow_call:
    inputs:
      context:
        description: "Docker build context"
        type: string
        default: "."
      dockerfile:
        description: "Path to the Dockerfile"
        type: string
        default: Dockerfile
      smoke-command:
        description: "Arguments passed to `docker run --rm <image>`; empty to skip the smoke test"
        type: string
        default: ""
      severity:
        description: "Severities that fail the gate"
        type: string
        default: CRITICAL,HIGH

permissions:
  contents: read

jobs:
  image:
    name: Build & scan the image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # SARIF upload of the Trivy results
    env:
      IMAGE: ci-image:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        env:
          CONTEXT: ${{ inputs.context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: docker build -t "${IMAGE}" -f "${DOCKERFILE}" "${CONTEXT}"

      - name: The image must run
        if: inputs.smoke-command != ''
        env:
          SMOKE: ${{ inputs.smoke-command }}
        # SMOKE holds the container arguments: split on whitespace, never globbed.
        run: |
          read -ra args <<<"${SMOKE}"
          docker run --rm "${IMAGE}" "${args[@]}"

      - name: Trivy — the gate (fixable vulnerabilities block the build)
        # ignore-unfixed: a CVE with no upstream fix cannot be acted on today.
        # Table format on purpose: with `format: sarif` the action reports every
        # severity whatever `severity` says, so gate and report are two steps.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          severity: ${{ inputs.severity }}
          ignore-unfixed: true
          exit-code: "1"

      - name: Trivy — the report (every severity, for code scanning)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: sarif
          output: trivy.sarif
          exit-code: "0"
          skip-setup-trivy: true # installed by the previous step

      - name: Upload the Trivy SARIF
        if: always() && hashFiles('trivy.sarif') != ''
        # Code scanning needs GHAS on private repositories; on public ones it is free.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: trivy.sarif
          category: trivy-image

      - name: SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Upload the SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-spdx
          path: sbom.spdx.json
          retention-days: 30
