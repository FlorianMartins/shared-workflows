version: 2

updates:
  # The actions this repository pins — and therefore every caller pins through it.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]
